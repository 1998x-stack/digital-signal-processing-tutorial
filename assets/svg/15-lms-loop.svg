<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="t15f2 d15f2" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif">
<title id="t15f2">LMS 自适应滤波器的信号流图</title>
<desc id="d15f2">输入向量 x[n] 经过当前权重 w[n] 得到输出 y[n]，与期望信号 d[n] 相减得到误差 e[n]；误差与输入一起送入权重更新块，按 w[n+1]=w[n]+mu e[n] x[n] 修正系数。整个过程是一个闭合的反馈回路，每来一个样本就更新一次。</desc>
<rect x="0" y="0" width="920" height="410" fill="#fffdf9"/>
<text x="30" y="38" font-size="15" font-weight="700" fill="#203035">LMS：误差驱动系数的闭环更新</text>
<text x="8" y="146" font-size="14" fill="#53676d">x[n]</text>
<polygon points="34,133 56,146 34,159" fill="#147f80"/>
<line x1="56" y1="146" x2="150" y2="146" stroke="#9fb8b2" stroke-width="1.6"/>
<rect x="150" y="116" width="180" height="60" rx="8" fill="#eef8f6" stroke="#147f80"/>
<text x="176" y="142" font-size="14" fill="#0d7779">FIR 滤波器 w[n]</text>
<text x="176" y="164" font-size="13" fill="#53676d">y[n] = wᵀ[n] x[n]</text>
<line x1="330" y1="146" x2="430" y2="146" stroke="#9fb8b2" stroke-width="1.6"/>
<text x="356" y="138" font-size="13" fill="#0d7779">y[n]</text>
<circle cx="470" cy="146" r="13" fill="#fff" stroke="#d06d4d" stroke-width="1.6"/><text x="463" y="151" font-size="14" fill="#b55c3e">−</text>
<line x1="430" y1="146" x2="457" y2="146" stroke="#9fb8b2" stroke-width="1.6"/>
<line x1="470" y1="60" x2="470" y2="133" stroke="#9fb8b2" stroke-width="1.6"/>
<text x="482" y="76" font-size="14" fill="#53676d">d[n]</text>
<line x1="470" y1="100" x2="470" y2="133" stroke="#9fb8b2" stroke-width="1.6"/>
<line x1="483" y1="146" x2="540" y2="146" stroke="#9fb8b2" stroke-width="1.6"/>
<polygon points="540,140 552,146 540,152" fill="#147f80"/>
<text x="560" y="151" font-size="14" fill="#203035">e[n]</text>
<line x1="470" y1="159" x2="470" y2="300" stroke="#9fb8b2" stroke-width="1.6"/>
<line x1="470" y1="300" x2="300" y2="300" stroke="#9fb8b2" stroke-width="1.6"/>
<polygon points="300,294 288,300 300,306" fill="#d06d4d"/>
<rect x="100" y="266" width="188" height="68" rx="8" fill="#fbf1ec" stroke="#d06d4d"/>
<text x="122" y="292" font-size="14" fill="#b55c3e">权重更新</text>
<text x="122" y="314" font-size="13" fill="#53676d">w[n+1]=w[n]+μ e[n] x[n]</text>
<line x1="100" y1="300" x2="60" y2="300" stroke="#9fb8b2" stroke-width="1.6"/>
<line x1="60" y1="300" x2="60" y2="176" stroke="#9fb8b2" stroke-width="1.6"/>
<polygon points="54,176 60,188 66,176" fill="#d06d4d"/>
<text x="70" y="250" font-size="13" fill="#7461ba">反向路径：用误差修正系数</text>
<text x="30" y="386" font-size="13" fill="#53676d">每样本一次乘加与一次更新；无矩阵求逆。上界 μ&lt;2/tr(R)，而 NLMS 用 ‖x[n]‖² 归一化步长。</text>
</svg>
