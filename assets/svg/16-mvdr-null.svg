<title id="t16f3">延时求和与 MVDR 波束图对比</title>
<desc id="d16f3">横轴为入射角（度），纵轴为阵列增益（分贝）。青色为延时求和（DAS）波束图，主瓣指向 0°。赭色为 MVDR 波束图，主瓣同样在 0° 保持单位增益，但在 -40° 干扰方向形成很深的零陷，抑制能力来自对协方差矩阵的自适应加权。</desc>
