<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-labelledby="t22a d22a">
<title id="t22a">FIR 滤波器的直接型与转置型 FPGA 结构</title>
<desc id="d22a">直接型每个抽头一个乘法器，乘积汇入组合加法树，关键路径随阶数增长；转置型把寄存器放在加法器之间，关键路径与阶数无关，只受单个乘累加延迟限制。</desc>
<rect x="0" y="0" width="920" height="420" fill="#fbfdfc"/>
<text x="30" y="32" font-family="system-ui,PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#33474d">同样的 FIR：乘法器数量与关键路径的权衡</text>

<text x="30" y="62" font-family="system-ui,PingFang SC,sans-serif" font-size="13.5" font-weight="600" fill="#147f80">直接型：N 个乘法器并行 + 组合加法树</text>
<g font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#53676d">
<rect x="60" y="76" width="52" height="30" fill="#e6f2f0" stroke="#147f80"/><text x="84" y="96">x[n]</text>
<rect x="112" y="76" width="52" height="30" fill="#f4f6f5" stroke="#c5d6ce"/><text x="130" y="96">z⁻¹</text>
<rect x="164" y="76" width="52" height="30" fill="#f4f6f5" stroke="#c5d6ce"/><text x="182" y="96">z⁻¹</text>
<rect x="216" y="76" width="52" height="30" fill="#f4f6f5" stroke="#c5d6ce"/><text x="234" y="96">z⁻¹</text>
</g>
<g font-family="system-ui,PingFang SC,sans-serif" font-size="12" fill="#b1592f">
<text x="72" y="132">×c0</text><text x="124" y="132">×c1</text><text x="176" y="132">×c2</text><text x="228" y="132">×c3</text>
</g>
<line x1="86" y1="106" x2="86" y2="118" stroke="#d06d4d" stroke-width="1.6"/>
<line x1="138" y1="106" x2="138" y2="118" stroke="#d06d4d" stroke-width="1.6"/>
<line x1="190" y1="106" x2="190" y2="118" stroke="#d06d4d" stroke-width="1.6"/>
<line x1="242" y1="106" x2="242" y2="118" stroke="#d06d4d" stroke-width="1.6"/>
<rect x="330" y="86" width="150" height="46" rx="8" fill="#fbeee9" stroke="#d06d4d"/>
<text x="344" y="114" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#b1592f">组合加法树 Σ</text>
<line x1="268" y1="110" x2="330" y2="110" stroke="#d06d4d" stroke-width="1.6"/>
<line x1="480" y1="110" x2="540" y2="110" stroke="#53676d" stroke-width="1.6"/><polygon points="540,110 530,106 530,114" fill="#53676d"/>
<text x="548" y="115" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#53676d">y[n]</text>
<text x="548" y="150" font-family="system-ui,PingFang SC,sans-serif" font-size="12.5" fill="#b1592f">关键路径 ≈ log₂(N)·加法器 + 乘法器；阶数越高越难时序收敛</text>

<text x="30" y="212" font-family="system-ui,PingFang SC,sans-serif" font-size="13.5" font-weight="600" fill="#5c4aa0">转置型：寄存器分隔，关键路径与阶数无关</text>
<g>
<rect x="60" y="240" width="90" height="40" rx="6" fill="#efeaf7" stroke="#7461ba"/><text x="80" y="265" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#5c4aa0">+ / ×c0</text>
<rect x="210" y="240" width="90" height="40" rx="6" fill="#efeaf7" stroke="#7461ba"/><text x="230" y="265" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#5c4aa0">+ / ×c1</text>
<rect x="360" y="240" width="90" height="40" rx="6" fill="#efeaf7" stroke="#7461ba"/><text x="380" y="265" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#5c4aa0">+ / ×c2</text>
<rect x="510" y="240" width="90" height="40" rx="6" fill="#efeaf7" stroke="#7461ba"/><text x="530" y="265" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#5c4aa0">+ / ×c3</text>
</g>
<g font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="#147f80">
<rect x="150" y="246" width="60" height="28" fill="#e6f2f0" stroke="#147f80"/><text x="168" y="264">z⁻¹</text>
<rect x="300" y="246" width="60" height="28" fill="#e6f2f0" stroke="#147f80"/><text x="318" y="264">z⁻¹</text>
<rect x="450" y="246" width="60" height="28" fill="#e6f2f0" stroke="#147f80"/><text x="468" y="264">z⁻¹</text>
</g>
<line x1="60" y1="230" x2="60" y2="260" stroke="#147f80" stroke-width="1.6"/>
<line x1="60" y1="230" x2="600" y2="230" stroke="#147f80" stroke-width="1.6"/>
<text x="40" y="226" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#147f80">x</text>
<text x="610" y="265" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#53676d">y</text>
<text x="60" y="312" font-family="system-ui,PingFang SC,sans-serif" font-size="12.5" fill="#5c4aa0">关键路径 ≈ 单个乘累加 + 寄存器建立时间；可达到很高时钟频率</text>

<text x="30" y="360" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#53676d">第三种思路：分布式算法（DA）用 LUT 预存系数组合的部分和，完全不用乘法器，但吞吐受</text>
<text x="30" y="382" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#53676d">逐位串行处理限制，适合低阶、低位宽场景。三种结构没有绝对优劣，取决于资源与速率约束。</text>
</svg>
