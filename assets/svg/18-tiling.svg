<rect x="60" y="80" width="76" height="60"/><rect x="136" y="80" width="76" height="60"/><rect x="212" y="80" width="76" height="60"/><rect x="288" y="80" width="76" height="60"/><rect x="364" y="80" width="76" height="60"/>
</g>
<line x1="510" y1="320" x2="890" y2="320" stroke="#718d88" stroke-width="1.5"/>
<line x1="510" y1="80" x2="510" y2="320" stroke="#718d88" stroke-width="1.5"/>
