<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="t18f1 d18f1" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif">
<title id="t18f1">STFT 的等面积时频格子与小波的对数格子</title>
<desc id="d18f1">左图是短时傅里叶变换的时频平面：所有格子的时间宽度与频率宽度都相同，由窗长决定，因此高频与低频使用相同的分辨率。右图是小波的时间-尺度平面：低频格子在时间上宽、在频率上窄，高频格子在时间上窄、在频率上宽，形成随频率变化的对数划分。</desc>
<rect x="0" y="0" width="920" height="400" fill="#fffdf9"/>
<text x="30" y="38" font-size="15" font-weight="700" fill="#203035">两种时频分辨率划分方式</text>
<text x="60" y="62" font-size="13" fill="#0d7779">STFT：固定窗长，等面积格子</text>
<text x="510" y="62" font-size="13" fill="#5b48a6">小波：随频率伸缩的对数格子</text>
<line x1="60" y1="320" x2="440" y2="320" stroke="#718d88" stroke-width="1.5"/>
<line x1="60" y1="80" x2="60" y2="320" stroke="#718d88" stroke-width="1.5"/>
<text x="430" y="338" font-size="12" fill="#53676d">t →</text>
<text x="24" y="76" font-size="12" fill="#53676d">f</text>
<g fill="#e6f3f0" stroke="#147f80" stroke-width="1">
<rect x="60" y="260" width="76" height="60"/><rect x="136" y="260" width="76" height="60"/><rect x="212" y="260" width="76" height="60"/><rect x="288" y="260" width="76" height="60"/><rect x="364" y="260" width="76" height="60"/>
