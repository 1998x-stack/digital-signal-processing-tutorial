<title id="t23f2">压缩器与限幅器的静态输入输出曲线</title>
<desc id="d23f2">横轴输入电平、纵轴输出电平（均为 dBFS）。阈值 -20 dBFS 以下输出等于输入（斜率为 1 的虚线）；超过阈值后 4:1 压缩器斜率变为 1/4，限幅器斜率趋近 0，把输出钉在约 0 dBFS 的天花板下。</desc>
