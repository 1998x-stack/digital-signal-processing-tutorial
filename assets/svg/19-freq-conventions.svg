<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-labelledby="t19b d19b">
<title id="t19b">频率轴约定与两种截止点定义</title>
<desc id="d19b">横轴为数字角频率 ω，从 0 到 π。窗函数法设计的 FIR 在 f_{c} 处幅度降到约 0.5，即 -6 dB 半幅点；巴特沃斯低通在临界点降到 1/√2，即 -3 dB 半功率点。</desc>
<rect x="0" y="0" width="920" height="420" fill="#fbfdfc"/>
<text x="30" y="32" font-family="system-ui,PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#33474d">同一条 ω 轴，不同的“截止频率”约定</text>

<line x1="70" y1="330" x2="860" y2="330" stroke="#53676d" stroke-width="1.6"/>
<line x1="70" y1="60" x2="70" y2="330" stroke="#53676d" stroke-width="1.6"/>
<line x1="70" y1="90" x2="860" y2="90" stroke="#e2ece8" stroke-width="1.2"/>
<line x1="70" y1="210" x2="860" y2="210" stroke="#e2ece8" stroke-width="1.2"/>

<text x="30" y="94" font-family="system-ui,PingFang SC,sans-serif" font-size="12.5" fill="#8a9aa0">1.0</text>
<text x="24" y="214" font-family="system-ui,PingFang SC,sans-serif" font-size="12.5" fill="#8a9aa0">0.5</text>
<text x="34" y="334" font-family="system-ui,PingFang SC,sans-serif" font-size="12.5" fill="#8a9aa0">0</text>
<text x="66" y="352" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#53676d">ω = 0</text>
<text x="505" y="352" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#53676d">ω_c（FIR：-6 dB / 巴特沃斯：-3 dB）</text>
<text x="820" y="352" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#53676d">ω = π</text>
<text x="388" y="388" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#8a9aa0">数字角频率 ω（rad/sample），对应模拟频率 f = ω·f_s/(2π)</text>

<line x1="360" y1="60" x2="360" y2="330" stroke="#c5d6ce" stroke-width="1.3" stroke-dasharray="5 4"/>
<polygon points="70,90 140,91 210,94 280,100 340,114 360,142 380,196 400,244 440,278 500,296 600,308 720,314 860,318" fill="none" stroke="#147f80" stroke-width="2.6"/>
<polygon points="70,90 150,90 230,90 300,91 340,96 360,120 380,180 400,238 440,276 500,296 600,308 720,314 860,318" fill="none" stroke="#d06d4d" stroke-width="2.2" stroke-dasharray="7 5"/>

<circle cx="360" cy="142" r="4.6" fill="#147f80"/>
<circle cx="360" cy="120" r="4.6" fill="#d06d4d"/>
<text x="374" y="138" font-family="system-ui,PingFang SC,sans-serif" font-size="12.5" fill="#147f80">FIR 半幅点 0.5 (−6 dB)</text>
<text x="374" y="116" font-family="system-ui,PingFang SC,sans-serif" font-size="12.5" fill="#b1592f">巴特沃斯半功率点 0.707 (−3 dB)</text>
<text x="120" y="80" font-family="system-ui,PingFang SC,sans-serif" font-size="12.5" fill="#147f80">实线：窗函数法 FIR</text>
<text x="120" y="102" font-family="system-ui,PingFang SC,sans-serif" font-size="12.5" fill="#b1592f">虚线：巴特沃斯低通</text>
</svg>
