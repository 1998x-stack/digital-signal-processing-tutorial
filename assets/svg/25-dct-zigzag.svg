<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="t25f3 d25f3" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif">
<title id="t25f3">8×8 DCT 系数网格与 Zig-zag 扫描顺序</title>
<desc id="d25f3">二维 DCT 把 8×8 图像块变换为 8×8 频率系数，左上角 (0,0) 是直流分量，越往右下角水平与垂直空间频率越高。之字形扫描按从低频到高频的顺序把矩阵展成一维，使量化后的长串零集中在序列尾部，便于熵编码。</desc>
<rect width="920" height="420" fill="#fffdf9"/>
<text x="30" y="34" font-size="15" font-weight="700" fill="#203035">DCT 系数：能量集中在左上，Zig-zag 从低频走到高频</text>
