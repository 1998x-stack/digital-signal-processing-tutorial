<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 920 390"><title id="title">数字角频率的 2π 周期性</title><desc id="desc">单位圆上角度 ω 和 ω 加整数倍 2π 到达相同点，因此整数采样的复指数序列等价。</desc><rect width="920" height="390" rx="16" fill="#fffdf9"/><text x="26" y="40" font-size="18" fill="#203035" font-weight="720" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">数字频率按 2π 周期重复，不同角度可以表示相同的样本</text><rect x="25" y="67" width="415" height="291" rx="12" fill="#f4faf7" stroke="#dce7e2"/><rect x="466" y="67" width="429" height="291" rx="12" fill="#fff8f2" stroke="#dce7e2"/><circle cx="232" cy="210" r="107" fill="#fff" stroke="#b9ccc5" stroke-width="2"/><line x1="105" y1="210" x2="359" y2="210" stroke="#97aca5" stroke-width="1.2" /><line x1="232" y1="83" x2="232" y2="337" stroke="#97aca5" stroke-width="1.2" /><circle cx="339" cy="210" r="3" fill="#dce7e2" stroke="none" stroke-width="1"/><circle cx="307.66042558696057" cy="134.33957441303943" r="3" fill="#dce7e2" stroke="none" stroke-width="1"/><circle cx="232" cy="103" r="3" fill="#dce7e2" stroke="none" stroke-width="1"/><circle cx="156.33957441303943" cy="134.33957441303943" r="3" fill="#dce7e2" stroke="none" stroke-width="1"/><circle cx="125" cy="210" r="3" fill="#dce7e2" stroke="none" stroke-width="1"/><circle cx="156.3395744130394" cy="285.66042558696057" r="3" fill="#dce7e2" stroke="none" stroke-width="1"/><circle cx="231.99999999999997" cy="317" r="3" fill="#dce7e2" stroke="none" stroke-width="1"/><circle cx="307.66042558696057" cy="285.6604255869606" r="3" fill="#dce7e2" stroke="none" stroke-width="1"/><line x1="232" y1="210" x2="308" y2="134" stroke="#d06d4d" stroke-width="2.2" /><path d="M 298 128 L 308 134 L 298 140" fill="none" stroke="#d06d4d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="313" y="119" font-size="17" fill="#d06d4d" font-weight="760" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">ω₀</text><text x="349" y="215" font-size="13" fill="#53676d" font-weight="500" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">0</text><text x="219" y="93" font-size="14" fill="#53676d" font-weight="500" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">π/2</text><text x="101" y="215" font-size="14" fill="#53676d" font-weight="500" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">π</text><text x="219" y="340" font-size="14" fill="#53676d" font-weight="500" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">3π/2</text><text x="488" y="108" font-size="16" fill="#203035" font-weight="670" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">复指数的样本完全相同：</text><text x="488" y="155" font-size="21" fill="#d06d4d" font-weight="690" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">e^{j(ω₀+2πk)n} = e^{jω₀n}</text><text x="488" y="202" font-size="15" fill="#53676d" font-weight="500" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">n、k 均为整数，额外的 2πkn</text><text x="488" y="227" font-size="15" fill="#53676d" font-weight="500" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">只产生整数个整周旋转。</text><rect x="490" y="279" width="342" height="32" rx="8" fill="#eff8f5" stroke="none"/><text x="502" y="301" font-size="14" fill="#147f80" font-weight="680" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">数字角频率：rad/sample</text></svg>