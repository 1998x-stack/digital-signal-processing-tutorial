<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 920 390"><title id="title">冲激分解推导 LTI 卷积</title><desc id="desc">线性和时不变将输入的加权冲激序列映射成同样权重的平移冲激响应，再将所有响应相加形成卷积。</desc><rect width="920" height="390" rx="16" fill="#fffdf9"/><text x="27" y="38" font-size="17" fill="#203035" font-weight="720" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">任意输入分解为加权冲激，LTI 系统把每个冲激变成平移的 h[n]</text><rect x="24" y="79" width="196" height="105" rx="12" fill="#fff" stroke="#147f80"/><text x="122" y="136" font-size="23" fill="#147f80" font-weight="760" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">x[n]</text><line x1="224" y1="131" x2="251" y2="131" stroke="#147f80" stroke-width="2.2" /><path d="M 241 125 L 251 131 L 241 137" fill="none" stroke="#147f80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="254" y="79" width="196" height="105" rx="12" fill="#fff" stroke="#d06d4d"/><text x="352" y="136" font-size="23" fill="#d06d4d" font-weight="760" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">Σ x[k]δ[n−k]</text><line x1="454" y1="131" x2="481" y2="131" stroke="#147f80" stroke-width="2.2" /><path d="M 471 125 L 481 131 L 471 137" fill="none" stroke="#147f80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="484" y="79" width="196" height="105" rx="12" fill="#fff" stroke="#7461ba"/><text x="582" y="136" font-size="23" fill="#7461ba" font-weight="760" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">Σ x[k]h[n−k]</text><line x1="684" y1="131" x2="711" y2="131" stroke="#147f80" stroke-width="2.2" /><path d="M 701 125 L 711 131 L 701 137" fill="none" stroke="#147f80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="714" y="79" width="196" height="105" rx="12" fill="#fff" stroke="#147f80"/><text x="812" y="136" font-size="23" fill="#147f80" font-weight="760" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">y[n]</text><rect x="26" y="219" width="867" height="111" rx="12" fill="#f3f9f6" stroke="#dce7e2"/><text x="48" y="253" font-size="17" fill="#203035" font-weight="660" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">例：h[n] = [1,1]，输入的每个样本都扩展为相邻两项。</text><text x="48" y="293" font-size="17" fill="#147f80" font-weight="710" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">所以 x=[1,2,1] 经过卷积得到 y=[1,3,3,1]。</text></svg>