<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="t26f3 d26f3" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif">
<title id="t26f3">频域降噪的时频掩码估计</title>
<desc id="d26f3">对带噪语音做短时傅里叶变换得到时频幅度图；神经网络估计一个 0 到 1 的掩码，对每个时频点加权。语音的谐波结构（深色带）被保留，噪声占优的时频点被压低。逐点相乘后再做逆 STFT 得到增强波形。</desc>
<rect width="920" height="420" fill="#fffdf9"/>
<text x="30" y="34" font-size="15" font-weight="700" fill="#203035">频域降噪：NN 估计时频掩码，逐点相乘</text>
