<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="t13f1 d13f1" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif">
<title id="t13f1">N 级 CIC 抽取器结构</title>
<desc id="d13f1">输入 x[n] 依次经过 N 个串联积分器（工作在 fs 高速率端），再经 M 倍下采样把速率降到 fs/M，然后经过 N 个串联梳状差分器输出 y[n]。积分器 y[n]=y[n-1]+x[n]，差分器 y[n]=x[n]-x[n-M]，全程只有加减与延迟，没有乘法器。</desc>
<rect x="0" y="0" width="920" height="400" fill="#fffdf9"/>
<text x="30" y="38" font-size="15" font-weight="700" fill="#203035">N 级 CIC 抽取器：积分器在高速率端，梳状在低速率端</text>
<text x="4" y="204" font-size="14" fill="#53676d">x[n]</text>
<line x1="42" y1="200" x2="112" y2="200" stroke="#9fb8b2" stroke-width="1.6"/>
<g fill="#eef8f6" stroke="#147f80"><rect x="150" y="150" width="150" height="100" rx="8"/><rect x="134" y="160" width="150" height="80" rx="8"/><rect x="118" y="170" width="150" height="60" rx="8"/></g>
<text x="150" y="204" font-size="15" font-weight="700" fill="#0d7779">积分器 ×N</text>
<text x="150" y="228" font-size="13" fill="#53676d">y[n]=y[n−1]+x[n]</text>
<line x1="300" y1="200" x2="360" y2="200" stroke="#9fb8b2" stroke-width="1.6"/>
<polygon points="360,194 372,200 360,206" fill="#147f80"/>
<rect x="382" y="174" width="86" height="52" rx="6" fill="#fdf0ea" stroke="#d06d4d"/>
<text x="398" y="207" font-size="15" font-weight="700" fill="#b55c3e">↓ M</text>
<line x1="468" y1="200" x2="520" y2="200" stroke="#9fb8b2" stroke-width="1.6"/>
<polygon points="520,194 532,200 520,206" fill="#147f80"/>
<g fill="#fdf0ea" stroke="#d06d4d"><rect x="600" y="150" width="170" height="100" rx="8"/><rect x="584" y="160" width="170" height="80" rx="8"/><rect x="568" y="170" width="170" height="60" rx="8"/></g>
<text x="600" y="204" font-size="15" font-weight="700" fill="#b55c3e">梳状 ×N</text>
<text x="600" y="228" font-size="13" fill="#53676d">y[n]=x[n]−x[n−M]</text>
<line x1="738" y1="200" x2="810" y2="200" stroke="#9fb8b2" stroke-width="1.6"/>
<polygon points="810,194 824,200 810,206" fill="#147f80"/>
<text x="834" y="205" font-size="14" fill="#203035">y[n]</text>
<line x1="118" y1="288" x2="738" y2="288" stroke="#bfdcd6" stroke-width="1.4"/>
<text x="120" y="312" font-size="13" fill="#0d7779">高速率 fs：N 个积分器逐一累加</text>
<text x="560" y="312" font-size="13" fill="#b55c3e">低速率 fs/M：差分器只需低速率运算</text>
<text x="30" y="366" font-size="13" fill="#53676d">直连增益为 M^N，第一零点在 ω=2π/M；无乘法器，仅加、减与延迟。</text>
</svg>
