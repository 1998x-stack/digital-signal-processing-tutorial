<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="t14f1 d14f1" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif">
<title id="t14f1">白噪声与含周期成分信号的自相关函数</title>
<desc id="d14f1">左图白噪声的自相关除 tau=0 处一个尖峰外几乎为零，说明样本之间互不相关；右图是一个正弦加噪声信号的自相关，随延迟衰减的同时保留与信号同周期的振荡，说明自相关能揭示被噪声掩盖的周期性。</desc>
<rect x="0" y="0" width="920" height="400" fill="#fffdf9"/>
<text x="30" y="36" font-size="15" font-weight="700" fill="#203035">① 白噪声：r[τ] 只在 τ=0 处出现尖峰</text>
