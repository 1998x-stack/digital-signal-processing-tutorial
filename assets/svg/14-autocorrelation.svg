<line x1="312" y1="250" x2="312" y2="248"/><line x1="329" y1="250" x2="329" y2="256"/><line x1="345" y1="250" x2="345" y2="243"/>
<line x1="362" y1="250" x2="362" y2="254"/><line x1="379" y1="250" x2="379" y2="247"/>
</g>
<text x="96" y="272" font-size="13" fill="#53676d">τ&lt;0</text>
<text x="360" y="272" font-size="13" fill="#53676d">τ&gt;0</text>
<text x="222" y="292" font-size="13" fill="#0d7779">τ=0：r[0]=平均功率</text>
<text x="30" y="352" font-size="15" font-weight="700" fill="#203035">② 正弦 + 噪声：r[τ] 衰减但保留同周期振荡</text>
