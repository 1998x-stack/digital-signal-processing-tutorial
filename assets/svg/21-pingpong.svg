<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-labelledby="t21a d21a">
<title id="t21a">DMA 乒乓缓冲：数据搬运与计算重叠</title>
<desc id="d21a">两个缓冲区乒乓交替：DMA 写入其中一个时，CPU 处理另一个；下一个时间片交换角色，因此任何时刻读写都不发生冲突，吞吐量翻倍。</desc>
<rect x="0" y="0" width="920" height="400" fill="#fbfdfc"/>
<text x="30" y="34" font-family="system-ui,PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#33474d">乒乓缓冲：DMA 与 CPU 永不同时访问同一缓冲区</text>

<g font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#53676d">
<text x="20" y="126">ping</text><text x="20" y="216">pong</text>
</g>

<rect x="110" y="100" width="185" height="44" rx="6" fill="#efeaf7" stroke="#7461ba"/><text x="168" y="127" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#5c4aa0">DMA 写入</text>
<rect x="295" y="100" width="185" height="44" rx="6" fill="#e6f2f0" stroke="#147f80"/><text x="356" y="127" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#147f80">CPU 处理</text>
<rect x="480" y="100" width="185" height="44" rx="6" fill="#efeaf7" stroke="#7461ba"/><text x="538" y="127" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#5c4aa0">DMA 写入</text>
<rect x="665" y="100" width="185" height="44" rx="6" fill="#e6f2f0" stroke="#147f80"/><text x="726" y="127" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#147f80">CPU 处理</text>

<rect x="110" y="190" width="185" height="44" rx="6" fill="#e6f2f0" stroke="#147f80"/><text x="171" y="217" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#147f80">CPU 处理</text>
<rect x="295" y="190" width="185" height="44" rx="6" fill="#efeaf7" stroke="#7461ba"/><text x="353" y="217" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#5c4aa0">DMA 写入</text>
<rect x="480" y="190" width="185" height="44" rx="6" fill="#e6f2f0" stroke="#147f80"/><text x="541" y="217" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#147f80">CPU 处理</text>
<rect x="665" y="190" width="185" height="44" rx="6" fill="#efeaf7" stroke="#7461ba"/><text x="723" y="217" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#5c4aa0">DMA 写入</text>

<line x1="110" y1="252" x2="850" y2="252" stroke="#53676d" stroke-width="1.4"/>
<g font-family="system-ui,PingFang SC,sans-serif" font-size="12.5" fill="#8a9aa0">
<text x="110" y="270">t0</text><text x="295" y="270">t1</text><text x="480" y="270">t2</text><text x="665" y="270">t3</text><text x="838" y="270">时间 →</text>
</g>

<rect x="110" y="300" width="16" height="16" fill="#efeaf7" stroke="#7461ba"/><text x="134" y="313" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#53676d">DMA 写入缓冲区</text>
<rect x="320" y="300" width="16" height="16" fill="#e6f2f0" stroke="#147f80"/><text x="344" y="313" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#53676d">CPU 处理缓冲区</text>

<text x="110" y="352" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#53676d">DMA 中断只做一件事：切换 active_buffer 并立刻启动下一次传输。</text>
<text x="110" y="376" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#53676d">CPU 永远处理“非活跃”的那个缓冲区，因此数据搬运与计算完全重叠。</text>
</svg>
