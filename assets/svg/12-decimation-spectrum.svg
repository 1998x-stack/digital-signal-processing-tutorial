<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="t12f1 d12f1" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif">
<title id="t12f1">下采样前后频谱的展宽与混叠折叠</title>
<desc id="d12f1">上图给出原信号幅度谱：带内分量位于 0.10 循环/样本（青色），带外分量位于 0.30（赭色），抗混叠截止 π/M 约在 0.167。下图是 M=3 下采样后的基带：0.30 分量折叠到约 0.033，与真实带内分量混在一起无法区分；若先经过截止 π/M 的低通，它会被移除。</desc>
<rect x="0" y="0" width="920" height="410" fill="#fffdf9"/>
<text x="30" y="36" font-size="15" font-weight="700" fill="#203035">① 原信号幅度谱 |X(f)|（横轴：循环/样本，Nyquist = 0.5）</text>
<line x1="80" y1="165" x2="840" y2="165" stroke="#9fb8b2" stroke-width="1.6"/>
<line x1="80" y1="60" x2="80" y2="165" stroke="#9fb8b2" stroke-width="1.6"/>
<g font-size="13" fill="#53676d"><text x="74" y="184">0</text><text x="222" y="184">0.1</text><text x="524" y="184">0.3</text><text x="816" y="184">0.5</text></g>
<line x1="333" y1="60" x2="333" y2="165" stroke="#7461ba" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="300" y="52" font-size="13" fill="#7461ba">π/M ≈ 0.167</text>
<polygon points="212,165 232,95 252,165" fill="#bfe6df" stroke="#147f80"/>
<text x="196" y="215" font-size="13" fill="#0d7779">带内 0.10</text>
<polygon points="516,165 536,105 556,165" fill="#f6ddcf" stroke="#d06d4d"/>
<text x="500" y="117" font-size="13" fill="#b55c3e">带外 0.30</text>
<path d="M536 150 C470 150 400 165 343 160" fill="none" stroke="#d06d4d" stroke-width="1.6"/>
<polygon points="343,160 358,155 356,166" fill="#d06d4d"/>
<text x="400" y="140" font-size="13" fill="#b55c3e">超过 π/M，将被折叠</text>
<text x="30" y="262" font-size="15" font-weight="700" fill="#203035">② M = 3 下采样后：可用基带只剩 0～π/M</text>
<rect x="80" y="280" width="253" height="85" fill="#f1f8f5" stroke="#bfdcd6"/>
<line x1="80" y1="365" x2="840" y2="365" stroke="#9fb8b2" stroke-width="1.6"/>
<line x1="80" y1="280" x2="80" y2="365" stroke="#9fb8b2" stroke-width="1.6"/>
<text x="300" y="384" font-size="13" fill="#53676d">0.1（保留）</text>
<polygon points="212,365 232,305 252,365" fill="#bfe6df" stroke="#147f80"/>
<polygon points="111,365 131,315 151,365" fill="#f6ddcf" stroke="#d06d4d"/>
<text x="96" y="404" font-size="13" fill="#b55c3e">混叠 ≈ 0.033</text>
<text x="380" y="330" font-size="13" fill="#53676d">0.30 折叠到 |0.30 − 1/3| ≈ 0.033，与真实低频成分叠加，无法区分</text>
</svg>
