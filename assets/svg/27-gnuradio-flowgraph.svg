<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-labelledby="t27f2 d27f2" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif">
<title id="t27f2">GNU Radio 接收 FM 广播的流图</title>
<desc id="d27f2">RTL-SDR 以 2.4 Msps 采样，经有理重采样降到 480 ksps 后由 WBFM 解调器解出基带音频，再重采样到 48 kHz 送声卡；频谱接收端用于可视化调试。每一级都标明采样率，模块间通过采样率变换连接。</desc>
<rect width="920" height="320" fill="#fffdf9"/>
<text x="30" y="34" font-size="15" font-weight="700" fill="#203035">流图：每一级都标明采样率</text>
<g font-size="12">
<rect x="30" y="70" width="150" height="58" rx="8" fill="#eef8f6" stroke="#147f80"/><text x="48" y="96" fill="#0d7779">RTL-SDR Source</text><text x="48" y="114" fill="#53676d">2.4 Msps，8 bit I/Q</text>
<rect x="240" y="70" width="150" height="58" rx="8" fill="#f3effa" stroke="#7461ba"/><text x="258" y="96" fill="#5b48a0">Rational Resampler</text><text x="258" y="114" fill="#53676d">2.4 M → 480 k</text>
<rect x="450" y="70" width="150" height="58" rx="8" fill="#fbf1ec" stroke="#d06d4d"/><text x="468" y="96" fill="#b55c3e">WBFM Receive</text><text x="468" y="114" fill="#53676d">Deviation 75 kHz</text>
<rect x="660" y="70" width="150" height="58" rx="8" fill="#f3effa" stroke="#7461ba"/><text x="678" y="96" fill="#5b48a0">Rational Resampler</text><text x="678" y="114" fill="#53676d">480 k → 48 k</text>
<rect x="660" y="200" width="150" height="52" rx="8" fill="#eef8f6" stroke="#147f80"/><text x="678" y="224" fill="#0d7779">Audio Sink</text><text x="678" y="242" fill="#53676d">48 kHz 声卡输出</text>
</g>
<g stroke="#9fb8b2" stroke-width="1.7" fill="none">
<line x1="180" y1="99" x2="240" y2="99"/><line x1="390" y1="99" x2="450" y2="99"/><line x1="600" y1="99" x2="660" y2="99"/>
<line x1="735" y1="128" x2="735" y2="200"/>
</g>
<polygon points="240,93 252,99 240,105" fill="#7461ba"/><polygon points="450,93 462,99 450,105" fill="#d06d4d"/><polygon points="660,93 672,99 660,105" fill="#7461ba"/><polygon points="729,200 735,212 741,200" fill="#147f80"/>
<rect x="240" y="200" width="300" height="52" rx="8" fill="#f7f3fb" stroke="#7461ba"/>
<text x="258" y="224" font-size="12" fill="#5b48a0">QT GUI Frequency Sink</text>
<text x="258" y="242" font-size="12" fill="#53676d">旁路：频谱可视化，用于调试</text>
<line x1="315" y1="128" x2="315" y2="200" stroke="#7461ba" stroke-width="1.3" stroke-dasharray="4 4"/>
<text x="30" y="290" font-size="13" fill="#53676d">抽取/内插与 CIC 等概念（第 12–13 章）直接对应这里的重采样模块。</text>
</svg>
