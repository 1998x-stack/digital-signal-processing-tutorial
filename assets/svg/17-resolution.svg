<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="t17f1 d17f1" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif">
<title id="t17f1">周期图与 Burg AR 谱对近邻频率的分辨对比</title>
<desc id="d17f1">横轴为频率（Hz），纵轴为归一化功率。赭色单峰是矩形窗周期图：两个间隔 0.6 Hz 的正弦被合并成一个宽峰，因为间距小于 f_s/N=1 Hz。青色曲线是 Burg AR 谱：同一段数据上出现两个分开的尖峰，且 AR 系数对应的反射系数都满足 |k|&lt;1，保证模型稳定。</desc>
<rect x="0" y="0" width="920" height="400" fill="#fffdf9"/>
<text x="30" y="38" font-size="15" font-weight="700" fill="#203035">同一段 64 点数据：一个宽峰 vs 两个尖峰</text>
<line x1="70" y1="300" x2="860" y2="300" stroke="#718d88" stroke-width="1.6"/>
<line x1="70" y1="80" x2="70" y2="300" stroke="#718d88" stroke-width="1.6"/>
<line x1="212" y1="80" x2="212" y2="300" stroke="#eef3f1"/>
