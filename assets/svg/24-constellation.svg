<title id="t24f3">QPSK、16QAM 与 64QAM 的星座图</title>
<desc id="d24f3">三种调制在复平面上的星座点布局。QPSK 只有 4 个点、幅度恒定；16QAM 每轴 4 个电平；64QAM 每轴 8 个电平。点越密，相邻点最小距离越小，要达到同样的误码率就需要越高的信噪比。</desc>
