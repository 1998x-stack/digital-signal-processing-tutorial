<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">双线性变换的稳定区域映射</title><desc id="fig-desc">模拟s平面的左半平面为稳定极点区；变换到数字z平面后为单位圆内部，原本虚轴对应单位圆边界。</desc><rect width="920" height="410" rx="14" fill="#fffdf9"/><text x="24" y="37" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="710" fill="#203035" text-anchor="start">双线性变换：s 平面左半区映射为 z 平面的单位圆内部</text><rect x="24" y="63" width="422" height="295" rx="12" fill="#f3f9f6" stroke="#d9e6e0"/><rect x="463" y="63" width="433" height="295" rx="12" fill="#fff6f0" stroke="#d9e6e0"/><text x="44" y="99" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#147f80" text-anchor="start">模拟 s 平面</text><text x="485" y="99" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#d06d4d" text-anchor="start">数字 z 平面</text><rect x="83" y="131" width="123" height="179" rx="12" fill="#dff1e9" stroke="none"/><line x1="206" y1="117" x2="206" y2="333" stroke="#779d92" stroke-width="1.7"/><line x1="66" y1="230" x2="402" y2="230" stroke="#a1b8ad" stroke-width="1"/><circle cx="147" cy="193" r="7" fill="#147f80"/><text x="95" y="174" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="700" fill="#147f80" text-anchor="start">Re(s)&lt;0</text><circle cx="683" cy="224" r="101" fill="#e6f2eb" stroke="#147f80" stroke-width="2"/><line x1="530" y1="224" x2="835" y2="224" stroke="#a4b9b0" stroke-width="1"/><line x1="683" y1="102" x2="683" y2="342" stroke="#a4b9b0" stroke-width="1"/><circle cx="633" cy="200" r="7" fill="#d06d4d"/><text x="611" y="178" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="680" fill="#d06d4d" text-anchor="start">|z|&lt;1</text><text x="31" y="393" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#53676d" text-anchor="start">s=2fₛ(1−z⁻¹)/(1+z⁻¹)：虚轴映射到单位圆，左半平面映射到圆内。</text></svg>