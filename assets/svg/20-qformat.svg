<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-labelledby="t20a d20a">
<title id="t20a">同一串二进制位在 Q15 与 Q4.12 下的不同数值</title>
<desc id="d20a">16 位码字 0100 0000 0000 0000 的小数点位置由约定决定：按 Q15 解释为 0.5，按 Q4.12 解释为 4.0。位权从 2^15 递减到 2^-15。</desc>
<rect x="0" y="0" width="920" height="400" fill="#fbfdfc"/>
<text x="30" y="34" font-family="system-ui,PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#33474d">同一串二进制位，两种解释：小数点位置是约定，芯片不会替你记</text>

<g font-family="system-ui,PingFang SC,sans-serif" font-size="12.5">
<text x="60" y="86" fill="#53676d">位序</text>
<text x="60" y="130" fill="#53676d">位权</text>
<text x="60" y="174" fill="#53676d">码字</text>
</g>

<g font-family="ui-monospace,Menlo,monospace" font-size="12">
<rect x="90" y="70" width="46" height="30" fill="#efeaf7" stroke="#7461ba"/><text x="108" y="90" fill="#5c4aa0">15</text>
<rect x="136" y="70" width="46" height="30" fill="#f4f6f5" stroke="#c5d6ce"/><text x="154" y="90" fill="#53676d">14</text>
<rect x="182" y="70" width="46" height="30" fill="#f4f6f5" stroke="#c5d6ce"/><text x="200" y="90" fill="#53676d">13</text>
<rect x="228" y="70" width="46" height="30" fill="#f4f6f5" stroke="#c5d6ce"/><text x="246" y="90" fill="#53676d">12</text>
<rect x="274" y="70" width="46" height="30" fill="#f4f6f5" stroke="#c5d6ce"/><text x="292" y="90" fill="#53676d">11</text>
<rect x="320" y="70" width="46" height="30" fill="#f4f6f5" stroke="#c5d6ce"/><text x="338" y="90" fill="#53676d">10</text>
<rect x="366" y="70" width="46" height="30" fill="#f4f6f5" stroke="#c5d6ce"/><text x="384" y="90" fill="#53676d">9</text>
<rect x="412" y="70" width="46" height="30" fill="#f4f6f5" stroke="#c5d6ce"/><text x="430" y="90" fill="#53676d">8</text>
<rect x="458" y="70" width="46" height="30" fill="#f4f6f5" stroke="#c5d6ce"/><text x="476" y="90" fill="#53676d">7</text>
<rect x="504" y="70" width="46" height="30" fill="#f4f6f5" stroke="#c5d6ce"/><text x="522" y="90" fill="#53676d">6</text>
<rect x="550" y="70" width="46" height="30" fill="#f4f6f5" stroke="#c5d6ce"/><text x="568" y="90" fill="#53676d">5</text>
<rect x="596" y="70" width="46" height="30" fill="#f4f6f5" stroke="#c5d6ce"/><text x="614" y="90" fill="#53676d">4</text>
<rect x="642" y="70" width="46" height="30" fill="#f4f6f5" stroke="#c5d6ce"/><text x="660" y="90" fill="#53676d">3</text>
<rect x="688" y="70" width="46" height="30" fill="#f4f6f5" stroke="#c5d6ce"/><text x="706" y="90" fill="#53676d">2</text>
<rect x="734" y="70" width="46" height="30" fill="#f4f6f5" stroke="#c5d6ce"/><text x="752" y="90" fill="#53676d">1</text>
<rect x="780" y="70" width="46" height="30" fill="#f4f6f5" stroke="#c5d6ce"/><text x="798" y="90" fill="#53676d">0</text>
</g>

<g font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#8a9aa0">
<text x="98" y="128">2^15</text><text x="144" y="128">2^14</text><text x="374" y="128">2^9</text><text x="508" y="128">2^5</text><text x="734" y="128">2^0</text><text x="786" y="128">2^-1</text><text x="822" y="128">…</text>
</g>

<g font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#33474d">
<text x="112" y="172">0</text><text x="158" y="172">1</text><text x="204" y="172">0</text><text x="250" y="172">0</text><text x="296" y="172">0</text><text x="342" y="172">0</text><text x="388" y="172">0</text><text x="434" y="172">0</text>
<text x="480" y="172">0</text><text x="526" y="172">0</text><text x="572" y="172">0</text><text x="618" y="172">0</text><text x="664" y="172">0</text><text x="710" y="172">0</text><text x="756" y="172">0</text><text x="802" y="172">0</text>
</g>

<line x1="136" y1="60" x2="136" y2="196" stroke="#147f80" stroke-width="2.4"/>
<text x="120" y="220" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#147f80">Q15 小数点 → 数值 = 0.5</text>
<line x1="274" y1="60" x2="274" y2="196" stroke="#d06d4d" stroke-width="2.4"/>
<text x="252" y="240" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#b1592f">Q4.12 小数点 → 数值 = 4.0</text>

<text x="30" y="292" font-family="system-ui,PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#33474d">固定总位宽下的取舍</text>
<line x1="120" y1="360" x2="860" y2="360" stroke="#53676d" stroke-width="1.4"/>
<polygon points="120,360 260,360 460,330 700,300 860,286" fill="none" stroke="#147f80" stroke-width="2.2"/>
<polygon points="120,286 260,300 460,330 700,354 860,360" fill="none" stroke="#d06d4d" stroke-width="2.2" stroke-dasharray="7 5"/>
<text x="128" y="352" font-family="system-ui,PingFang SC,sans-serif" font-size="12.5" fill="#147f80">精度 2^(−n)</text>
<text x="740" y="346" font-family="system-ui,PingFang SC,sans-serif" font-size="12.5" fill="#b1592f">动态范围 2^(m−1)</text>
<text x="300" y="382" font-family="system-ui,PingFang SC,sans-serif" font-size="13" fill="#53676d">小数位 n 增大 →（向右）⇢ 精度升、整数位 m 减少 → 动态范围降</text>
</svg>
