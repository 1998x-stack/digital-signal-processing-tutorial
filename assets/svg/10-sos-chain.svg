<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">IIR 高阶滤波器的二阶节级联结构</title><desc id="fig-desc">输入信号串联通过三个二阶节，每个二阶节有二阶的分子及分母多项式，最后形成高阶滤波器输出。</desc><rect width="920" height="380" rx="14" fill="#fffdf9"/><text x="22" y="35" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="730" fill="#203035" text-anchor="start">高阶 IIR 用二阶节级联：每节检查极点、增益与数值尺度</text><rect x="23" y="62" width="873" height="293" rx="12" fill="#f3f9f6" stroke="#d9e6e0"/><rect x="38" y="144" width="123" height="85" rx="12" fill="#fff" stroke="#147f80"/><text x="99" y="195" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="750" fill="#147f80" text-anchor="middle">x[n]</text><rect x="200" y="117" width="178" height="142" rx="12" fill="#fff" stroke="#d06d4d"/><text x="289" y="147" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="730" fill="#d06d4d" text-anchor="middle">SOS 1</text><text x="289" y="183" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="500" fill="#203035" text-anchor="middle">b₀+b₁z⁻¹+b₂z⁻²</text><line x1="227" y1="198" x2="351" y2="198" stroke="#d9e6e0" stroke-width="1"/><text x="289" y="220" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="500" fill="#203035" text-anchor="middle">1+a₁z⁻¹+a₂z⁻²</text><rect x="410" y="117" width="178" height="142" rx="12" fill="#fff" stroke="#7461ba"/><text x="499" y="147" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="730" fill="#7461ba" text-anchor="middle">SOS 2</text><text x="499" y="183" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="500" fill="#203035" text-anchor="middle">b₀+b₁z⁻¹+b₂z⁻²</text><line x1="437" y1="198" x2="561" y2="198" stroke="#d9e6e0" stroke-width="1"/><text x="499" y="220" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="500" fill="#203035" text-anchor="middle">1+a₁z⁻¹+a₂z⁻²</text><rect x="620" y="117" width="178" height="142" rx="12" fill="#fff" stroke="#d06d4d"/><text x="709" y="147" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="730" fill="#d06d4d" text-anchor="middle">SOS 3</text><text x="709" y="183" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="500" fill="#203035" text-anchor="middle">b₀+b₁z⁻¹+b₂z⁻²</text><line x1="647" y1="198" x2="771" y2="198" stroke="#d9e6e0" stroke-width="1"/><text x="709" y="220" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="500" fill="#203035" text-anchor="middle">1+a₁z⁻¹+a₂z⁻²</text><line x1="162" y1="189" x2="199" y2="189" stroke="#147f80" stroke-width="2.3"/><line x1="379" y1="189" x2="409" y2="189" stroke="#147f80" stroke-width="2.3"/><line x1="589" y1="189" x2="619" y2="189" stroke="#147f80" stroke-width="2.3"/><line x1="799" y1="189" x2="888" y2="189" stroke="#147f80" stroke-width="2.3"/><text x="41" y="319" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="500" fill="#53676d" text-anchor="start">根到多项式系数的转换可能放大数值误差；二阶节形式通常比高阶直达式更稳健。</text></svg>