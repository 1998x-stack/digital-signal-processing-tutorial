<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="t23f1 d23f1" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif">
<title id="t23f1">峰值均衡器在不同 Q 值下的幅频响应</title>
<desc id="d23f1">同一个中心频率 1 kHz、增益 +12 dB 的峰值滤波器，Q=0.7 时过渡平缓、影响宽频带；Q=2 时较集中；Q=10 时形成一个很窄的尖峰并伴随明显相位的急剧变化。Q 越大峰越窄，对系数量化越敏感。</desc>
<rect width="920" height="420" fill="#fffdf9"/>
