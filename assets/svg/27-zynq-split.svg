<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-labelledby="t27f3 d27f3" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif">
<title id="t27f3">Zynq SDR 的 PL 与 PS 任务划分</title>
<desc id="d27f3">射频前端 AD9361 输出的 I/Q 数据进入 Zynq 的可编程逻辑（PL），在 PL 中完成 DDC/DUC、FIR 滤波、FFT 与同步/信道估计等吞吐敏感的处理；ARM 处理器（PS）负责 MAC 调度、参数配置与协议栈等控制敏感的任务，两者通过 AXI4-Stream 交换数据。</desc>
<rect width="920" height="380" fill="#fffdf9"/>
<text x="30" y="34" font-size="15" font-weight="700" fill="#203035">吞吐敏感放 PL，控制敏感放 PS</text>
<rect x="70" y="60" width="780" height="60" rx="9" fill="#fbf1ec" stroke="#d06d4d"/>
<text x="92" y="86" font-size="13" fill="#b55c3e">射频前端 AD9361</text>
<text x="92" y="106" font-size="12" fill="#53676d">LNA · 混频 · AGC · 正交校正 · 12 bit ADC/DAC（I/Q 数据流）</text>
<rect x="70" y="140" width="500" height="150" rx="9" fill="#f3effa" stroke="#7461ba"/>
<text x="92" y="166" font-size="13" font-weight="700" fill="#5b48a0">Zynq PL（可编程逻辑）</text>
<g font-size="12" fill="#5b48a0">
<rect x="92" y="182" width="140" height="42" rx="6" fill="#fff" stroke="#7461ba"/><text x="106" y="208">DDC / DUC（CIC）</text>
<rect x="248" y="182" width="120" height="42" rx="6" fill="#fff" stroke="#7461ba"/><text x="262" y="208">FIR 成形滤波</text>
<rect x="384" y="182" width="150" height="42" rx="6" fill="#fff" stroke="#7461ba"/><text x="398" y="208">FFT / IFFT（OFDM）</text>
<rect x="92" y="234" width="200" height="42" rx="6" fill="#fff" stroke="#7461ba"/><text x="106" y="260">同步 / 信道估计</text>
<rect x="308" y="234" width="226" height="42" rx="6" fill="#fff" stroke="#7461ba"/><text x="322" y="260">QAM 映射 / 解映射</text>
</g>
<rect x="600" y="140" width="250" height="150" rx="9" fill="#eef8f6" stroke="#147f80"/>
<text x="622" y="166" font-size="13" font-weight="700" fill="#0d7779">Zynq PS（ARM 核）</text>
<text x="622" y="194" font-size="12" fill="#53676d">MAC 层调度</text>
<text x="622" y="216" font-size="12" fill="#53676d">参数配置（增益/校正）</text>
<text x="622" y="238" font-size="12" fill="#53676d">网络协议栈（IP/UDP）</text>
<text x="622" y="260" font-size="12" fill="#53676d">状态监控与用户界面</text>
<line x1="570" y1="215" x2="600" y2="215" stroke="#9fb8b2" stroke-width="1.8"/>
<line x1="600" y1="215" x2="600" y2="215" stroke="#9fb8b2"/>
<polygon points="594,209 606,215 594,221" fill="#147f80"/>
<text x="544" y="305" font-size="11" fill="#53676d">AXI4-Stream</text>
<text x="70" y="330" font-size="13" fill="#53676d">PL 与 PS 通过 AXI4-Stream 交换 I/Q 数据；数据流密集的操作放 PL，控制密集的操作放 PS。</text>
<text x="70" y="356" font-size="13" fill="#53676d">表中不列出具体比特率或许可带宽：它们随器件与配置变化，应以厂商资料与实测为准。</text>
</svg>
