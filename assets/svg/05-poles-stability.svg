<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 920 390"><title id="title">极点位置与冲激响应衰减比较</title><desc id="desc">a 等于 0.7 时，一阶因果冲激响应随 n 衰减并可绝对求和；a 等于 1.05 时冲激响应增长且不绝对可和。</desc><rect width="920" height="390" rx="16" fill="#fffdf9"/><text x="26" y="39" font-size="18" fill="#203035" font-weight="720" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">因果一阶系统：h[n] = aⁿ u[n]；极点半径决定冲激响应是否衰减</text><rect x="23" y="65" width="421" height="282" rx="12" fill="#f3f9f5" stroke="#dce7e2"/><text x="41" y="106" font-size="17" fill="#147f80" font-weight="700" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">a = 0.7：衰减，BIBO 稳定</text><line x1="43" y1="229.25" x2="422" y2="229.25" stroke="#a5b9b4" stroke-width="1.2" /><line x1="61" y1="229.25" x2="61" y2="202.65" stroke="#147f80" stroke-width="2.5" /><circle cx="61" cy="202.65" r="4" fill="#147f80" stroke="none" stroke-width="1"/><text x="61" y="253.25" font-size="13" fill="#53676d" font-weight="450" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">0</text><line x1="92.18181818181819" y1="229.25" x2="92.18181818181819" y2="210.63" stroke="#147f80" stroke-width="2.5" /><circle cx="92.18181818181819" cy="210.63" r="4" fill="#147f80" stroke="none" stroke-width="1"/><line x1="123.36363636363637" y1="229.25" x2="123.36363636363637" y2="216.216" stroke="#147f80" stroke-width="2.5" /><circle cx="123.36363636363637" cy="216.216" r="4" fill="#147f80" stroke="none" stroke-width="1"/><text x="123.36363636363637" y="253.25" font-size="13" fill="#53676d" font-weight="450" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">2</text><line x1="154.54545454545456" y1="229.25" x2="154.54545454545456" y2="220.1262" stroke="#147f80" stroke-width="2.5" /><circle cx="154.54545454545456" cy="220.1262" r="4"