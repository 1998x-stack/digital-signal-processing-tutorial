<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 920 391"><title id="title">ROC 的正确半径方向：右边序列在外，左边序列在内</title><desc id="desc">右边面板以青色环形区域代表模大于零点七的 z，内侧留白；左边面板以橘色圆内代表模小于零点七的 z。两面板均标极点零点七及单位圆。</desc><rect width="920" height="391" rx="16" fill="#fffdf9"/><text x="25" y="38" font-size="18" font-family="Inter,system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#203035" font-weight="720" text-anchor="start">同一有理式 X(z) = 1/(1 − 0.7z⁻¹)，不同 ROC 意味着不同序列</text><rect x="22" y="60" width="420" height="310" rx="10" fill="#f4faf7" stroke="#dce7e2"/><text x="40" y="93" font-size="18" font-family="Inter,system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#147f80" font-weight="750" text-anchor="start">右边序列：|z| &gt; 0.7</text><circle cx="231" cy="203" r="124" fill="#e2f3ed" stroke="none" stroke-width="1"/><circle cx="231" cy="203" r="65" fill="#f4faf7" stroke="#d5e8e0" stroke-width="1"/><line x1="101" y1="203" x2="361" y2="203" stroke="#9fb7af" stroke-width="1.2" /><line x1="231" y1="73" x2="231" y2="333" stroke="#9fb7af" stroke-width="1.2" /><circle cx="231" cy="203" r="93" fill="none" stroke="#7461ba" stroke-width="2"/><circle cx="231" cy="203" r="65" fill="none" stroke="#147f80" stroke-width="2"/><circle cx="296" cy="203" r="7" fill="#fff" stroke="#d06d4d" stroke-width="2"/><line x1="292" y1="199" x2="300" y2="207" stroke="#d06d4d" stroke-width="2" /><line x1="300" y1="199" x2="292" y2="207" stroke="#d06d4d" stroke-width="2" /><text x="304" y="191" font-size="13" font-family="Inter,system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#d06d4d" font-weight="680" text-anchor="start">p=0.7</text><text x="335" y="223" font-size="13" font-family="Inter,system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#7461ba" font-weight="590" text-anchor="start">|z|=1</text><text x="40" y="337" font-size="17" font-family="Inter,system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#203035" font-weight="710" text-anchor="start">x[n]=0.7ⁿu[n]</text><text x="40" y="358" font-size="13" font-family="Inter,system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#53676d" font-weight="470" text-anchor="start">浅青色环为 ROC 的可见部分</text><rect x="474" y="60" width="420" height="310" rx="10" fill="#fff8f3" stroke="#dce7e2"/><text x="492" y="93" font-size="18" font-family="Inter,system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#d06d4d" font-weight="750" text-anchor="start">左边序列：|z| &lt; 0.7</text><circle cx="683" cy="203" r="65" fill="#fde7dc" stroke="none" stroke-width="1"/><line x1="553" y1="203" x2="813" y2="203" stroke="#9fb7af" stroke-width="1.2" /><line x1="683" y1="73" x2="683" y2="333" stroke="#9fb7af" stroke-width="1.2" /><circle cx="683" cy="203" r="93" fill="none" stroke="#7461ba" stroke-width="2"/><circle cx="683" cy="203" r="65" fill="none" stroke="#d06d4d" stroke-width="2"/><circle cx="748" cy="203" r="7" fill="#fff" stroke="#d06d4d" stroke-width="2"/><line x1="744" y1="199" x2="752" y2="207" stroke="#d06d4d" stroke-width="2" /><line x1="752" y1="199" x2="744" y2="207" stroke="#d06d4d" stroke-width="2" /><text x="756" y="191" font-size="13" font-family="Inter,system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#d06d4d" font-weight="680" text-anchor="start">p=0.7</text><text x="787" y="223" font-size="13" font-family="Inter,system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#7461ba" font-weight="590" text-anchor="start">|z|=1</text><text x="492" y="337" font-size="17" font-family="Inter,system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#203035" font-weight="710" text-anchor="start">x[n]=−0.7ⁿu[−n−1]</text><text x="492" y="358" font-size="13" font-family="Inter,system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#53676d" font-weight="470" text-anchor="start">浅橘色圆内为 ROC</text></svg>