<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 920 390"><title id="title">Z 变换的两种 ROC 决定两种信号</title><desc id="desc">两个 z 平面示意同一有理式：右边序列收敛于极点半径外，左边序列收敛于极点半径内；两个面板都有极点 0.7 和单位圆。图中浅色区域仅指 ROC 的一部分，由文字精确定义。</desc><rect width="920" height="390" rx="16" fill="#fffdf9"/><text x="25" y="38" font-size="18" fill="#203035" font-weight="710" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">同一个代数式 X(z) = 1/(1 − 0.7z⁻¹)，收敛域决定序列方向</text><rect x="24" y="63" width="419" height="291" rx="12" fill="#f4faf7" stroke="#dce7e2"/><circle cx="231" cy="200" r="90" fill="#fff" stroke="#adc4bc" stroke-width="2"/><line x1="106" y1="200" x2="356" y2="200" stroke="#afc0b9" stroke-width="1.2" /><line x1="231" y1="75" x2="231" y2="325" stroke="#afc0b9" stroke-width="1.2" /><circle cx="231" cy="200" r="63" fill="#e5f3f0" stroke="none" stroke-width="1"/><circle cx="231" cy="200" r="90" fill="none" stroke="#147f80" stroke-width="2.5"/><text x="46" y="91" font-size="17" fill="#147f80" font-weight="750" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">右边序列：|z| &gt; 0.7</text><text x="46" y="324" font-size="17" fill="#203035" font-weight="700" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">x[n]=0.7ⁿ u[n]</text><circle cx="294" cy="200" r="6" fill="#fff" stroke="#d06d4d" stroke-width="3"/><text x="303" y="190" font-size="14" fill="#d06d4d" font-weight="690" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">极点 0.7</text><text x="321" y="216" font-size="13" fill="#53676d" font-weight="500" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">|z|=1</text><rect x="475" y="63" width="419" height="291" rx="12" fill="#fff8f3" stroke="#dce7e2"/><circle cx="682" cy="200" r="90" fill="#fff" stroke="#adc4bc" stroke-width="2"/><line x1="557" y1="200" x2="807" y2="200" stroke="#afc0b9" stroke-width="1.2" /><line x1="682" y1="75" x2="682" y2="325" stroke="#afc0b9" stroke-width="1.2" /><circle cx="682" cy="200" r="63" fill="#fce8de" stroke="none" stroke-width="1"/><circle cx="682" cy="200" r="90" fill="none" stroke="#7461ba" stroke-width="2.5"/><text x="497" y="91" font-size="17" fill="#d06d4d" font-weight="750" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">左边序列：|z| &lt; 0.7</text><text x="497" y="324" font-size="17" fill="#203035" font-weight="700" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">x[n]=−0.7ⁿ u[−n−1]</text><circle cx="745" cy="200" r="6" fill="#fff" stroke="#d06d4d" stroke-width="3"/><text x="754" y="190" font-size="14" fill="#d06d4d" font-weight="690" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">极点 0.7</text><text x="772" y="216" font-size="13" fill="#53676d" font-weight="500" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">|z|=1</text></svg>