<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 920 390"><title id="title">采样频谱周期延拓与混叠</title><desc id="desc">以四赫兹采样使三赫兹信号谱的周期副本折叠到正负一赫兹；虚线指出奈奎斯特区间边界。</desc><rect width="920" height="390" rx="16" fill="#fffdf9"/><text x="26" y="39" font-size="18" fill="#203035" font-weight="720" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">采样把模拟频谱按 fₛ 周期复制，副本重叠时无法唯一恢复</text><rect x="23" y="69" width="867" height="285" rx="12" fill="#f5faf8" stroke="#dce7e2"/><line x1="48" y1="268" x2="870" y2="268" stroke="#8faa9f" stroke-width="1.2" /><line x1="450" y1="101" x2="450" y2="299" stroke="#aec5bc" stroke-width="1.3" /><line x1="60" y1="264" x2="60" y2="273" stroke="#899e98" stroke-width="1" /><text x="60" y="292" font-size="13" fill="#53676d" font-weight="450" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">-5</text><line x1="138" y1="264" x2="138" y2="273" stroke="#899e98" stroke-width="1" /><text x="138" y="292" font-size="13" fill="#53676d" font-weight="450" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">-4</text><line x1="216" y1="264" x2="216" y2="273" stroke="#899e98" stroke-width="1" /><text x="216" y="292" font-size="13" fill="#53676d" font-weight="450" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">-3</text><line x1="294" y1="264" x2="294" y2="273" stroke="#899e98" stroke-width="1" /><text x="294" y="292" font-size="13" fill="#53676d" font-weight="450" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">-2</text><line x1="372" y1="264" x2="372" y2="273" stroke="#899e98" stroke-width="1" /><text x="372" y="292" font-size="13" fill="#53676d" font-weight="450" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"