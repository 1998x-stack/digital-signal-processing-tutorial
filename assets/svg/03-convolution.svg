<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 920 390"><title id="title">有限序列的线性卷积运算</title><desc id="desc">三个并排杆状图显示输入序列 1、2、1 与滤波器 1、1 的线性卷积产生输出 1、3、3、1，并展示 y[1] 的逐项计算。</desc><rect width="920" height="390" rx="16" fill="#fffdf9"/><text x="25" y="38" font-size="18" fill="#203035" font-weight="720" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">卷积不是逐点相乘：输出样本累加所有重叠的乘积</text><rect x="22" y="62" width="277" height="257" rx="12" fill="#f4faf7" stroke="#dce7e2"/><text x="42" y="103" font-size="18" fill="#147f80" font-weight="730" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">输入 x[n]</text><line x1="42" y1="213" x2="279" y2="213" stroke="#a5b9b4" stroke-width="1.2" /><line x1="60" y1="213" x2="60" y2="192.73333333333335" stroke="#147f80" stroke-width="2.5" /><circle cx="60" cy="192.73333333333335" r="4" fill="#147f80" stroke="none" stroke-width="1"/><text x="60" y="237" font-size="13" fill="#53676d" font-weight="450" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">0</text><line x1="160.5" y1="213" x2="160.5" y2="172.46666666666667" stroke="#147f80" stroke-width="2.5" /><circle cx="160.5" cy="172.46666666666667" r="4" fill="#147f80" stroke="none" stroke-width="1"/><text x="160.5" y="237" font-size="13" fill="#53676d" font-weight="450" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">1</text><line x1="261" y1="213" x2="261" y2="192.73333333333335" stroke="#147f80" stroke-width="2.5" /><circle cx="261" cy="192.73333333333335" r="4" fill="#147f80" stroke="none" stroke-width="1"/><text x="261" y="237" font-size="13" fill="#53676d" font-weight="450" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">2</text><rect x="320" y="62" width="277" height="257" rx="12" fill="#fff7f2" stroke="#dce7e2"/><text x="340" y="103" font-size="18" fill="#d06d4d" font-weight="730" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">系统 h[n]</text><line x1="340" y1="213" x2="577" y2="213" stroke="#a5b9b4" stroke-width="1.2" /><line x1="358" y1="213" x2="358" y2="192.73333333333335" stroke="#d06d4d" stroke-width="2.5" /><circle cx="358" cy="192.73333333333335" r="4" fill="#d06d4d" stroke="none" stroke-width="1"/><text x="358" y="237" font-size="13" fill="#53676d" font-weight="450" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">0</text><line x1="559" y1="213" x2="559" y2="192.73333333333335" stroke="#d06d4d" stroke-width="2.5" /><circle cx="559" cy="192.73333333333335" r="4" fill="#d06d4d" stroke="none" stroke-width="1"/><text x="559" y="237" font-size="13" fill="#53676d" font-weight="450" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">1</text><rect x="620" y="62" width="277" height="257" rx="12" fill="#f4faf7" stroke="#dce7e2"/><text x="640" y="103" font-size="18" fill="#7461ba" font-weight="730" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">输出 y[n]</text><line x1="640" y1="213" x2="877" y2="213" stroke="#a5b9b4" stroke-width="1.2" /><line x1="658" y1="213" x2="658" y2="192.73333333333335" stroke="#7461ba" stroke-width="2.5" /><circle cx="658" cy="192.73333333333335" r="4" fill="#7461ba" stroke="none" stroke-width="1"/><text x="658" y="237" font-size="13" fill="#53676d" font-weight="450" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">0</text><line x1="725" y1="213" x2="725" y2="152.2" stroke="#7461ba" stroke-width="2.5" /><circle cx="725" cy="152.2" r="4" fill="#7461ba" stroke="none" stroke-width="1"/><text x="725" y="237" font-size="13" fill="#53676d" font-weight="450" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">1</text><line x1="792" y1="213" x2="792" y2="152.2" stroke="#7461ba" stroke-width="2.5" /><circle cx="792" cy="152.2" r="4" fill="#7461ba" stroke="none" stroke-width="1"/><text x="792" y="237" font-size="13" fill="#53676d" font-weight="450" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">2</text><line x1="859" y1="213" x2="859" y2="192.73333333333335" stroke="#7461ba" stroke-width="2.5" /><circle cx="859" cy="192.73333333333335" r="4" fill="#7461ba" stroke="none" stroke-width="1"/><text x="859" y="237" font-size="13" fill="#53676d" font-weight="450" text-anchor="middle" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">3</text><line x1="290" y1="197" x2="318" y2="197" stroke="#ad7931" stroke-width="2.2" /><path d="M 308 191 L 318 197 L 308 203" fill="none" stroke="#ad7931" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="590" y1="197" x2="618" y2="197" stroke="#ad7931" stroke-width="2.2" /><path d="M 608 191 L 618 197 L 608 203" fill="none" stroke="#ad7931" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="335" width="864" height="36" rx="5" fill="#eff8f5" stroke="none"/><text x="42" y="359" font-size="17" fill="#203035" font-weight="660" text-anchor="start" font-family="Inter,system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">y[1] = x[0]h[1] + x[1]h[0] = 1 + 2 = 3</text></svg>