<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">八点基二 DIT 快速傅里叶变换的偶奇分治结构</title><desc id="fig-desc">奇偶各四个样本分别求四点DFT，接着对每个k用旋转因子W8的k次方产生一对八点DFT输出。</desc><rect width="920" height="410" rx="14" fill="#fffdf9"/><text x="24" y="38" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="740" fill="#203035" text-anchor="start">8 点 DIT FFT：偶索引 DFT 与奇索引 DFT 如何重新组合？</text><rect x="24" y="65" width="873" height="308" rx="12" fill="#f3f9f6" stroke="#d9e6e0"/><rect x="40" y="162" width="148" height="88" rx="12" fill="#fff" stroke="#147f80"/><text x="114" y="194" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="740" fill="#147f80" text-anchor="middle">8 个输入</text><text x="114" y="226" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#53676d" text-anchor="middle">x[0…7]</text><rect x="250" y="92" width="219" height="99" rx="12" fill="#fff" stroke="#d06d4d"/><text x="359.5" y="124" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="740" fill="#d06d4d" text-anchor="middle">偶索引</text><text x="359.5" y="156" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#53676d" text-anchor="middle">x[0],x[2],x[4],x[6]</text><rect x="250" y="242" width="219" height="99" rx="12" fill="#fff" stroke="#7461ba"/><text x="359.5" y="274" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="740" fill="#7461ba" text-anchor="middle">奇索引</text><text x="359.5" y="306" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#53676d" text-anchor="middle">x[1],x[3],x[5],x[7]</text><line x1="189" y1="206" x2="246" y2="140" stroke="#d06d4d" stroke-width="2.2"/><line x1="189" y1="206" x2="246" y2="289" stroke="#7461ba" stroke-width="2.2"/><rect x="530" y="141" width="215" height="146" rx="12" fill="#fff" stroke="#147f80"/><text x="637.5" y="173" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="740" fill="#147f80" text-anchor="middle">组合蝶形</text><text x="637.5" y="205" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#53676d" text-anchor="middle">E[k] ± W₈ᵏO[k]</text><line x1="471" y1="143" x2="525" y2="185" stroke="#d06d4d" stroke-width="2.2"/><line x1="471" y1="294" x2="525" y2="236" stroke="#7461ba" stroke-width="2.2"/><rect x="787" y="176" width="94" height="80" rx="12" fill="#fff" stroke="#147f80"/><text x="834" y="208" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="740" fill="#147f80" text-anchor="middle">输出</text><text x="834" y="240" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#53676d" text-anchor="middle">X[k]</text><line x1="746" y1="214" x2="782" y2="214" stroke="#147f80" stroke-width="2.2"/><text x="34" y="401" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#53676d" text-anchor="start">W₈ᵏ=e^(−j2πk/8)，上半 X[k]=E[k]+W₈ᵏO[k]；下半 X[k+4]=E[k]−W₈ᵏO[k]，k=0…3。</text></svg>