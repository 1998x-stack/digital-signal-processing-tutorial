name: Content quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pages, local links and SVG
        run: python scripts/validate_site.py
      - name: Validate numerical experiments
        run: python examples/check_examples.py
